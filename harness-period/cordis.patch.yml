# 峰谷判定 + 节假日覆盖。
# 判定和节假日都读 ~/.tokenlensbar/prices.json 的 off_peak（旧 ~/.tokenlens 兼容；
# 可用 TOKENLENSBAR_PRICES 或 TOKENLENS_PRICES 覆盖路径）：
# 工作日 09:00-12:00、14:00-18:00 为高价，周末和 holidays 全天为低价。
# UI：只在输入框左侧控制区（模型选择器左边）显示一颗标签：低价/高价 + 冒号 + 原因
#     （周末、节假日或时间），不占用模型名称宽度；节假日未配置时原因位置显示
#     「节假日未配置」。侧边栏不再有任何提示。
#     标签与 1017 同尺寸圆角，低价蓝色（1017 同款）、高价红色。
# 只用 Harness 主题 token，不覆盖主题。
- insert:
    - id: harness-period
      name: '@local/harness-period'
