# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
    fontSize: 16
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      xiaomi:
        apiKeyEnv: XIAOMI_API_KEY
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY

- insert:
    - id: prompt-inject
      name: "@local/prompt-inject"
      config:
        dir: "/Volumes/TUF ESD-T1A Media/dsh-plugins/prompt-inject"
- id: entry-customization
  disabled: true

# 关闭自动压缩（auto: false）：不再按阈值自动压缩，也不再在上游报上下文溢出时自动恢复；
# 手动 /compact 仍然可用。想恢复自动压缩：删掉这一项，或把 auto 改成 true。
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    auto: false
