<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标线段编辑器 · 田字格</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #d3d7de;
    --ink: #14161a;
    --muted: #6b7280;
    --accent: #4176e6;
    --border: #e3e6eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517;
      --card: #1d1f23;
      --line: #363a41;
      --ink: #f2f3f5;
      --muted: #9aa1ab;
      --accent: #7aaaff;
      --border: #2c2f35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }
  .grid-card { flex: 0 0 auto; }
  .side { flex: 1 1 320px; min-width: 300px; display: flex; flex-direction: column; gap: 16px; }
  svg#grid { display: block; width: 420px; height: 420px; touch-action: manipulation; }
  .seg .base {
    stroke: var(--line);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
    fill: none;
  }
  .seg .live {
    stroke: var(--accent);
    stroke-width: 4px;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    fill: none;
    opacity: 0;
    transition: opacity .08s ease;
  }
  .seg.on .live { opacity: 1; }
  .seg.on .base { opacity: .2; }
  .seg:hover .base { stroke: var(--accent); opacity: .55; }
  .seg:not(.on):hover .live { opacity: .35; }
  .seg .hit {
    stroke: transparent;
    stroke-width: 16px;
    vector-effect: non-scaling-stroke;
    fill: none;
    cursor: pointer;
  }
  .points circle { fill: var(--line); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; opacity: .9; }
  .status { margin-top: 10px; color: var(--muted); font-size: 13px; min-height: 20px; }
  .status b { color: var(--ink); font-weight: 600; }
  .previews { display: flex; gap: 16px; align-items: flex-end; }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .tile.light { background: #fff; color: #111; }
  .tile.dark { background: #17181b; color: #fff; }
  .sizes { display: flex; gap: 12px; align-items: flex-end; }
  .size { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .size span { font-size: 11px; color: var(--muted); }
  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font: 12px/1.6 "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .row h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd {
    font: 11px/1 "SF Mono", Menlo, monospace;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 2px 5px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>图标线段编辑器 · 田字格</h1>
  <p class="lead">点线段切换显示。左侧是 3×3 个格点、12 段；画好后复制底部的代码发给我，我就能精确还原。</p>

  <div class="wrap">
    <div class="card grid-card">
      <svg id="grid" viewBox="-3 -3 30 30" aria-label="田字格线段编辑器"></svg>
      <div class="toolbar">
        <button id="clear">清空</button>
        <button id="all">全选</button>
        <button id="invert">反转</button>
        <button id="download">下载 SVG</button>
      </div>
      <div class="status" id="status">已选 0 段</div>
    </div>

    <div class="side">
      <div class="card">
        <div class="row"><h2>预览</h2><span class="hint">24 / 48 / 96 px</span></div>
        <div class="previews">
          <div class="size">
            <div class="tile light" style="width:96px;height:96px">
              <svg class="preview" width="96" height="96" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d=""/></svg>
            </div>
            <span>浅色</span>
          </div>
          <div class="size">
            <div class="tile dark" style="width:96px;height:96px">
              <svg class="preview" width="96" height="96" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d=""/></svg>
            </div>
            <span>深色</span>
          </div>
          <div class="size">
            <div class="tile light" style="width:48px;height:48px">
              <svg class="preview" width="48" height="48" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d=""/></svg>
            </div>
            <span>48</span>
          </div>
          <div class="size">
            <div class="tile light" style="width:24px;height:24px">
              <svg class="preview" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d=""/></svg>
            </div>
            <span>24</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="row"><h2>给 Hermes 的代码</h2><span class="hint">复制整段</span></div>
        <textarea id="out" readonly spellcheck="false"></textarea>
        <div class="toolbar">
          <button class="primary" id="copy">复制</button>
          <button id="copyPath">只复制 path</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const PTS = [3, 12, 21];
  const STORE = 'dsh-icon-editor-v1';

  const SEGMENTS = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 2; c++) {
      SEGMENTS.push({ id: `H${r}${c}`, kind: 'h', x1: PTS[c], y1: PTS[r], x2: PTS[c + 1], y2: PTS[r] });
    }
  }
  for (let c = 0; c < 3; c++) {
    for (let r = 0; r < 2; r++) {
      SEGMENTS.push({ id: `V${c}${r}`, kind: 'v', x1: PTS[c], y1: PTS[r], x2: PTS[c], y2: PTS[r + 1] });
    }
  }

  const on = new Set(load());
  const hashIds = location.hash.replace(/^#/, '').split(',').map((x) => x.trim()).filter(Boolean);
  if (hashIds.length > 0) {
    on.clear();
    for (const id of hashIds) on.add(id);
  }
  const grid = document.getElementById('grid');
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  const nodes = new Map();

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify([...on])); } catch {}
    try {
      const ids = SEGMENTS.filter((s) => on.has(s.id)).map((s) => s.id);
      history.replaceState(null, '', ids.length ? '#' + ids.join(',') : location.pathname);
    } catch {}
  }

  // 格点
  const points = document.createElementNS(NS, 'g');
  points.setAttribute('class', 'points');
  for (const y of PTS) for (const x of PTS) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 0.16);
    points.appendChild(c);
  }
  grid.appendChild(points);

  // 线段
  for (const s of SEGMENTS) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'seg' + (on.has(s.id) ? ' on' : ''));
    g.dataset.id = s.id;

    const base = document.createElementNS(NS, 'line');
    const live = document.createElementNS(NS, 'line');
    const hit = document.createElementNS(NS, 'line');
    for (const el of [base, live, hit]) {
      el.setAttribute('x1', s.x1); el.setAttribute('y1', s.y1);
      el.setAttribute('x2', s.x2); el.setAttribute('y2', s.y2);
    }
    base.setAttribute('class', 'base');
    live.setAttribute('class', 'live');
    hit.setAttribute('class', 'hit');

    hit.addEventListener('click', () => toggle(s.id));
    hit.addEventListener('pointerenter', () => {
      status.innerHTML = `<b>${s.id}</b> · ${describe(s)}`;
    });
    hit.addEventListener('pointerleave', () => renderStatus());

    g.append(base, live, hit);
    grid.appendChild(g);
    nodes.set(s.id, g);
  }

  function describe(s) {
    if (s.kind === 'h') return `第 ${['上', '中', '下'][PTS.indexOf(s.y1)]} 行${s.x1 === PTS[0] ? '左' : '右'}段`;
    return `第 ${['左', '中', '右'][PTS.indexOf(s.x1)]} 列${s.y1 === PTS[0] ? '上' : '下'}段`;
  }

  function toggle(id) {
    if (on.has(id)) on.delete(id); else on.add(id);
    const g = nodes.get(id);
    if (g) g.classList.toggle('on', on.has(id));
    save();
    render();
  }

  function buildPath() {
    const parts = [];
    for (const s of SEGMENTS) {
      if (!on.has(s.id)) continue;
      parts.push(`M${s.x1} ${s.y1}${s.kind === 'h' ? 'H' + s.x2 : 'V' + s.y2}`);
    }
    return parts.join('');
  }

  function buildCode() {
    const ids = SEGMENTS.filter((s) => on.has(s.id)).map((s) => s.id);
    const path = buildPath();
    return [
      `segments: ${ids.join(' ') || '(none)'}`,
      `path: ${path || '(empty)'}`,
    ].join('\n');
  }

  function render() {
    const path = buildPath();
    for (const p of document.querySelectorAll('.preview path')) p.setAttribute('d', path);
    out.value = buildCode();
    renderStatus();
  }

  function renderStatus() {
    status.textContent = `已选 ${on.size} 段` + (on.size ? ' · 点线段可继续切换' : ' · 点线段开始画');
  }

  async function readout() {
    try {
      await navigator.clipboard.writeText(out.value);
    } catch {
      out.select();
      document.execCommand('copy');
    }
    const btn = document.getElementById('copy');
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = old; }, 1200);
  }

  document.getElementById('copy').addEventListener('click', readout);
  document.getElementById('copyPath').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(buildPath()); } catch { out.select(); document.execCommand('copy'); }
  });
  document.getElementById('clear').addEventListener('click', () => {
    on.clear();
    for (const g of nodes.values()) g.classList.remove('on');
    save(); render();
  });
  document.getElementById('all').addEventListener('click', () => {
    for (const s of SEGMENTS) on.add(s.id);
    for (const g of nodes.values()) g.classList.add('on');
    save(); render();
  });
  document.getElementById('invert').addEventListener('click', () => {
    for (const s of SEGMENTS) {
      if (on.has(s.id)) on.delete(s.id); else on.add(s.id);
      nodes.get(s.id).classList.toggle('on', on.has(s.id));
    }
    save(); render();
  });
  document.getElementById('download').addEventListener('click', () => {
    const path = buildPath();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="${path}" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></svg>\n`;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ygelon-icon.svg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  render();
})();
</script>
</body>
</html>
